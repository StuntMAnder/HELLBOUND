<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLBOUND</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% -10%,#51213c,#17121e 55%,#08090f);color:#f8edf2;font:14px system-ui}main{width:min(100%,1100px)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.logo{font-size:clamp(30px,5vw,48px);font-weight:950;letter-spacing:.2em;text-shadow:0 0 26px #e52e5c}.sub,.build{font:10px monospace;letter-spacing:.25em;color:#c18fa4}.frame{border:1px solid #a34c68;box-shadow:0 0 0 5px #211521,0 24px 70px #000b;background:#080910}canvas{width:100%;height:auto;aspect-ratio:384/224;display:block;image-rendering:pixelated}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#1c1521;border-top:1px solid #67364b;color:#c8b4c1;font:10px monospace;letter-spacing:.12em}button{background:#401e31;border:1px solid #ad4a69;color:white;padding:8px 13px;font-weight:800;cursor:pointer}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#a99bab;font:10px monospace;margin-top:13px}.controls b{color:#f2dce5}.foot{font:10px monospace;color:#8b7487;margin-top:12px}
</style></head><body><main><header><div><div class="logo">HELLBOUND</div><div class="sub">THE PIT HAS NO EXIT</div></div><div class="build">ARCADE SYSTEM // BUILD 0.6</div></header>
<div class="frame"><canvas id="game" width="384" height="224"></canvas><div class="status"><span>MODE: ARCADE / LOCAL VERSUS</span><span id="status">PRESS ENTER</span><button id="reset">RETURN TO MENU</button></div></div>
<div class="controls"><span><b>P1</b> A/D MOVE · W JUMP · S CROUCH · Q DASH · F LIGHT · G HEAVY · T GUARD</span><span><b>P2</b> ←/→ MOVE · ↑ JUMP · ↓ CROUCH · O DASH · J LIGHT · K HEAVY · I GUARD</span></div><div class="foot">384 × 224 PIXEL PLAYFIELD · BUILD 0.6 — RENDER RECOVERY</div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),keys=Object.create(null);
const FLOOR=183, names=['HANK','REAPER','PHANTOM'], colors=['#ff4668','#d8d1df','#c5a2ff'];
let mode='title',frame=0,seconds=99,selection=[0,1],turn=0,shake=0,particles=[],p1,p2,winner=-1;
const fighters=[{x:105,hp:100,meter:0,face:1,vy:0,stun:0,attack:0,guard:false,crouch:false,dash:0,cd:0},{x:279,hp:100,meter:0,face:-1,vy:0,stun:0,attack:0,guard:false,crouch:false,dash:0,cd:0}];
function reset(){fighters.forEach((p,i)=>Object.assign(p,{x:i?279:105,hp:100,meter:0,face:i?-1:1,vy:0,stun:0,attack:0,guard:false,crouch:false,dash:0,cd:0}));seconds=99;mode='fight';status.textContent='FIGHT!';}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function text(s,x,y,size=8,color='#fff',align='left'){ctx.fillStyle=color;ctx.font='bold '+size+'px monospace';ctx.textAlign=align;ctx.fillText(s,x,y);}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);points.slice(1).forEach(v=>ctx.lineTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function glow(x,y,r,c,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}
function backdrop(){let grad=ctx.createLinearGradient(0,0,0,224);grad.addColorStop(0,'#111322');grad.addColorStop(.55,'#302035');grad.addColorStop(1,'#0b0b13');ctx.fillStyle=grad;ctx.fillRect(0,0,384,224);
for(let i=0;i<11;i++){let x=i*39-8,h=48+(i*17)%39;rect(x,166-h,27,h,'#171725');rect(x+3,169-h,2,h-8,'#382338');}
glow(192,78,43,'#b62c52',.12);ctx.fillStyle='#47263c';ctx.beginPath();ctx.arc(192,78,27,0,7);ctx.fill();rect(0,176,384,48,'#12111a');rect(0,176,384,2,'#a84966');for(let i=0;i<12;i++){ctx.strokeStyle='#261d2a';ctx.beginPath();ctx.moveTo(i*34,183);ctx.lineTo(i*34+17,223);ctx.stroke();}}
function drawFighter(p,id){let x=p.x,y=FLOOR+(p.crouch?7:0),c=colors[id],t=frame*.09+(id*1.8),bob=p.vy===0?Math.sin(t*(Math.abs(p.vx||0)>.2?3:1))*(Math.abs(p.vx||0)>.2?1.4:.5):0;
glow(x,FLOOR-2,16,c,.13);ctx.save();ctx.translate(Math.round(x),Math.round(y+bob));ctx.scale(p.face,1);
if(id===0){poly([[-8,-42],[-18,-37],[-27,-26],[-23,-8],[-13,-18],[-7,-18]],'#79182f','#bd3551');poly([[-10,-43],[9,-43],[13,-23],[7,-13],[-9,-13],[-14,-25]],'#292a35','#79727e');poly([[-10,-56],[-7,-63],[7,-63],[12,-55],[8,-44],[-8,-44]],'#34323d','#a49aa5');poly([[-8,-56],[-5,-59],[7,-58],[9,-53],[5,-49],[-7,-49]],'#080a12','#6c5c68');rect(-7,-55,6,3,'#fa3156');rect(2,-55,6,3,'#fa3156');for(let a of [-18,18]){rect(a-2,-32,4,18,'#c8b8ad');rect(a-6,-24,12,4,'#b92b49');}}
else if(id===1){poly([[-12,-47],[-18,-32],[-14,-12],[-19,-3],[-8,-9],[0,-3],[9,-9],[17,-3],[13,-35],[9,-51]],'#090a10','#494351');poly([[-13,-54],[-9,-63],[0,-67],[10,-62],[14,-51],[8,-43],[-9,-43]],'#08090f','#55505c');poly([[-7,-52],[0,-56],[7,-52],[5,-47],[-6,-47]],'#030409');ctx.strokeStyle='#e7e1ed';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,-34);ctx.lineTo(20,-21);ctx.quadraticCurveTo(32,-13,28,-28);ctx.stroke();}
else{poly([[-10,-54],[-20,-50],[-22,-29],[-15,-13],[-13,-36]],'#e6e0ec','#aaa2b8');poly([[-10,-42],[9,-42],[13,-22],[7,-13],[-8,-13],[-14,-24]],'#666178','#b9aeca');poly([[-10,-57],[-7,-64],[7,-64],[12,-57],[8,-45],[-8,-45]],'#b9b4c8','#eee6f5');poly([[-7,-56],[-5,-59],[5,-59],[8,-55],[5,-51],[-6,-51]],'#292638','#877a9d');rect(-5,-55,10,2,'#c39aff');rect(-1,-39,2,15,'#d5a8ff');}
if(p.guard){ctx.strokeStyle=c;ctx.globalAlpha=.6;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-29,28,-1.1,1.1);ctx.stroke();}
if(p.attack>0){ctx.strokeStyle=c;ctx.lineWidth=3;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(13,-29,26,-.9,.8);ctx.stroke();}
if(p.stun){rect(-12,-51,24,2,'#fff');}
ctx.restore();rect(x-13,FLOOR+1,26,2,'#07070b');}
function hud(){text('1P '+names[selection[0]],8,11);text(names[selection[1]]+' 2P',376,11,8,'#fff','right');rect(8,16,154,7,'#302333');rect(8,16,154*fighters[0].hp/100,7,'#e83a61');rect(222,16,154,7,'#302333');rect(376-154*fighters[1].hp/100,16,154*fighters[1].hp/100,7,'#a78ce8');text(''+seconds,192,35,14,'#fff','center');}
function selectScreen(){backdrop();text('SELECT YOUR FIGHTER',192,25,12,'#fff','center');text(turn?'PLAYER 2 — SELECT':'PLAYER 1 — SELECT',192,38,7,'#ef8aa5','center');for(let i=0;i<3;i++){let x=66+i*126;rect(x-47,52,94,126,selection[turn]===i?'#382032':'#171520');glow(x,105,22,colors[i],.16);text(names[i],x,160,8,colors[i],'center');text(i===0?'TONFA':i===1?'SICKLE':'PHASE',x,172,6,'#d6c4d1','center');}text('A / D OR ARROWS TO CHOOSE · ENTER TO CONFIRM',192,214,6,'#c4a9b8','center');}
function title(){backdrop();glow(192,94,65,'#df2858',.2);text('HELLBOUND',192,76,28,'#fff','center');text('THE PIT HAS NO EXIT',192,91,7,'#e95b7a','center');text('CHOOSE YOUR FATE',192,128,8,'#e8d5df','center');text('PRESS ENTER TO BEGIN',192,158,9,'#fff','center');text('ARCADE COMBAT / LOCAL VERSUS',192,190,6,'#a98e9f','center');}
function update(p,o,i){p.face=o.x>p.x?1:-1;let left=i?keys.ArrowLeft:keys.a,right=i?keys.ArrowRight:keys.d,jump=i?keys.ArrowUp:keys.w,down=i?keys.ArrowDown:keys.s,guard=i?keys.i:keys.t,dash=i?keys.o:keys.q,light=i?keys.j:keys.f,heavy=i?keys.k:keys.g;
p.guard=!!guard&&p.stun===0;p.crouch=!!down&&p.vy===0&&!p.guard;
if(p.stun>0){p.stun--;p.attack=0;}else{if(p.cd>0)p.cd--;if(dash&&!p.cd){p.dash=8;p.cd=35;}if(p.dash>0){p.dash--;p.vx=p.face*5.5;}else p.vx=p.guard?0:(right?1:0)-(left?1:0);p.x+=p.vx*(p.crouch?.35: i?1.5:2);if(jump&&p.vy===0&&!p.crouch)p.vy=-5.3;if(light||heavy){if(!p.attack)p.attack=heavy?22:15;}}
p.y=(p.y||FLOOR)+p.vy;p.vy+=.28;if(p.y>=FLOOR){p.y=FLOOR;p.vy=0;}p.x=Math.max(25,Math.min(359,p.x));if(p.attack>0)p.attack--;}
function combat(){let a=fighters[0],b=fighters[1];update(a,b,0);update(b,a,1);for(let [p,o] of [[a,b],[b,a]]){if(p.attack>7&&Math.abs(p.x-o.x)<38&&Math.abs((p.y||FLOOR)-(o.y||FLOOR))<26){o.hp=Math.max(0,o.hp-(o.guard?1:5));o.stun=o.guard?2:8;p.meter=Math.min(100,p.meter+10);p.attack=6;shake=3;}}
if(frame%60===0)seconds=Math.max(0,seconds-1);if(!a.hp||!b.hp||!seconds){winner=a.hp===b.hp?-1:a.hp>b.hp?0:1;mode='over';status.textContent='MATCH COMPLETE';}}
function render(){frame++;ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.7;}if(mode==='title')title();else if(mode==='select')selectScreen();else{backdrop();if(mode==='fight')combat();drawFighter(fighters[0],selection[0]);drawFighter(fighters[1],selection[1]);hud();if(mode==='over'){rect(55,75,274,70,'#0b0a12');text(winner<0?'DRAW':names[selection[winner]]+' WINS',192,108,16,'#fff','center');text('ENTER REMATCH · ESC FIGHTER SELECT',192,128,6,'#e8c3d2','center');}}ctx.restore();requestAnimationFrame(render);}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='Enter'){if(mode==='title'){mode='select';status.textContent='FIGHTER SELECT';}else if(mode==='select'){if(turn===0)turn=1;else{turn=0;reset();}}else if(mode==='over')reset();}if(e.key==='Escape'&&(mode==='fight'||mode==='over')){mode='select';turn=0;status.textContent='FIGHTER SELECT';}if(mode==='select'&&['a','A','d','D','ArrowLeft','ArrowRight'].includes(e.key))selection[turn]=(selection[turn]+(['a','A','ArrowLeft'].includes(e.key)?2:1))%3;});
document.addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('reset').onclick=()=>{mode='title';turn=0;status.textContent='PRESS ENTER';};requestAnimationFrame(render);
})();</script></body></html>
