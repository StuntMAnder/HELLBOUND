<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLBOUND</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d16;color:#f5eaf0;font:14px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}main{width:min(100%,1000px)}h1{letter-spacing:.22em;color:#f7e8ed;text-shadow:0 0 20px #e43e63;margin:0 0 12px;font-size:clamp(28px,5vw,44px)}.frame{background:#090a11;border:1px solid #854157;box-shadow:0 0 0 5px #211722,0 18px 60px #000;border-radius:6px;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.meta{padding:10px 14px;background:#1a1420;color:#bdaebb;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px}button{background:#351c2c;border:1px solid #a34460;color:white;padding:9px 14px;cursor:pointer}p{color:#a99cab;font-size:12px}.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style></head><body><main><h1>HELLBOUND</h1><div class="frame"><canvas id="c" width="384" height="224"></canvas><div class="meta"><span>ARCADE PROTOTYPE · 384 × 224</span><span id="status">PRESS ENTER</span><button id="reset">RESET</button></div></div><div class="controls"><p>P1: A/D move · W jump · F light · G heavy · H special · T guard</p><p>P2: ←/→ move · ↑ jump · J light · K heavy · L special · I guard</p></div><p>Build 0.1 — original procedural character studies are temporary; approved sprite art will replace them when supplied.</p></main>
<script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),status=document.querySelector('#status'),K={};const W=384,H=224,F=185;let mode='title',tick=0,time=99,turn=0,chosen=[0,1],shake=0,winner=0;
const R=[['HANK','TONFA RUSHER','#b51f43','#ff526c',1.9,8,31],['REAPER','DARK PUNISHER','#171722','#eee9f2',1.4,13,43],['PHANTOM','PHASE STRIKER','#7460a5','#c8aaff',2.2,9,34]];
function make(id,side){return{id,side,x:side?278:106,y:F,v:0,vy:0,hp:100,face:side?-1:1,stun:0,atk:0,kind:'light',cool:0,guard:false,jump:false,hit:-1,meter:0}}
let a=make(0,0),b=make(1,1);
function start(){a=make(chosen[0],0);b=make(chosen[1],1);time=99;mode='fight';status.textContent='FIGHT!'}
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function txt(s,x,y,n=8,col='#fff',align='left'){g.fillStyle=col;g.font='bold '+n+'px monospace';g.textAlign=align;g.fillText(s,x,y)}
function stage(){let z=g.createLinearGradient(0,0,0,H);z.addColorStop(0,'#171626');z.addColorStop(.7,'#392033');z.addColorStop(1,'#100e17');g.fillStyle=z;g.fillRect(0,0,W,H);for(let i=0;i<9;i++){let q=i*48;box(q,92+(i%3)*5,30,86,'#211c2b');box(q+6,101+(i%3)*5,3,42,'#493044')}box(0,178,W,46,'#17131c');box(0,178,W,2,'#a34e67')}
function draw(p){let [name,tag,col,glow]=R[p.id],d=p.face;g.save();g.translate(Math.round(p.x),Math.round(p.y)+Math.sin(tick*.17+p.side)*1);g.scale(d,1);
if(p.id===0){g.fillStyle='#8d1738';g.beginPath();g.moveTo(-7,-43);g.lineTo(-28,-35+Math.sin(tick*.14)*4);g.lineTo(-24,-8);g.lineTo(-5,-17);g.fill();box(-8,-48,17,23,'#25232d');box(-9,-57,18,12,'#393743');box(-7,-54,14,5,'#080910');box(-7,-53,5,3,'#ff405e');box(2,-53,5,3,'#ff405e');box(-9,-26,18,20,'#292833');box(-8,-9,7,10,'#24232d');box(2,-9,7,10,'#24232d');box(-17,-31,5,18,'#c8b5a6');box(13,-31,5,18,'#c8b5a6');box(-19,-18,8,3,'#db394f');box(12,-18,8,3,'#db394f')}
else if(p.id===1){g.fillStyle='#08080e';g.beginPath();g.moveTo(-14,-48);g.quadraticCurveTo(0,-67,14,-48);g.lineTo(12,-25);g.lineTo(-12,-25);g.fill();box(-10,-31,20,23,'#171722');box(-8,-9,7,10,'#11111a');box(2,-9,7,10,'#11111a');box(-6,-42,12,2,'#e8e3ed');g.strokeStyle='#d9d5e1';g.lineWidth=2;g.beginPath();g.moveTo(15,-30);g.lineTo(23,-17);g.quadraticCurveTo(35,-23,29,-33);g.stroke()}
else{g.fillStyle='#e7e1ef';g.beginPath();g.moveTo(-7,-54);g.quadraticCurveTo(-28,-49,-25,-22);g.lineTo(-18,-9);g.lineTo(-15,-35);g.lineTo(-5,-48);g.fill();box(-10,-48,20,15,'#b9b5c6');box(-8,-45,16,7,'#252332');box(-5,-43,10,3,'#b68aff');box(-11,-30,22,22,'#555267');box(-8,-27,16,5,'#9b83d1');box(-8,-8,7,9,'#6a637b');box(2,-8,7,9,'#6a637b');box(-15,-28,5,16,'#8d78bb');box(10,-28,5,16,'#8d78bb')}
if(p.atk>0){g.globalAlpha=.6;g.fillStyle=glow;g.beginPath();g.ellipse(24,-25,p.kind==='heavy'?21:15,8,0,0,7);g.fill()}g.restore()}
function bar(x,y,w,v,col,rev=false){box(x,y,w,8,'#392b39');box(rev?x+w-w*v/100:x,y,w*v/100,8,col);box(x,y,w,1,'#d9b6c3')}
function hud(){txt(R[a.id][0],8,12,8);txt(R[b.id][0],376,12,8,'#fff','right');bar(8,17,154,a.hp,'#d9365d');bar(222,17,154,b.hp,'#a98ce7',true);txt('ROUND 1',192,12,7,'#e8cbd5','center');txt(('0'+Math.ceil(time)).slice(-2),192,36,13,'#fff','center')}
function update(p,o){p.face=o.x>p.x?1:-1;if(p.stun>0){p.stun--;p.v*=.8}else{let left=p.side?K.ArrowLeft:K.a,right=p.side?K.ArrowRight:K.d,jump=p.side?K.ArrowUp:K.w,guard=p.side?K.i:K.t,light=p.side?K.j:K.f,heavy=p.side?K.k:K.g,special=p.side?K.l:K.h;p.guard=!!guard;if(p.cool>0)p.cool--;if(p.atk>0)p.atk--;if(!p.guard&&!p.atk){p.v=((right?1:0)-(left?1:0))*R[p.id][4];if(jump&&!p.jump){p.vy=-5.4;p.jump=true}if(p.cool<=0&&(light||heavy||special)){p.kind=light?'light':heavy?'heavy':'special';p.atk=p.kind==='light'?12:p.kind==='heavy'?18:25;p.cool=p.atk;p.v=0}}else p.v*=.7}
p.x=Math.max(22,Math.min(362,p.x+p.v));p.y+=p.vy;p.vy+=.28;if(p.y>=F){p.y=F;p.vy=0;p.jump=false}}
function hit(p,o){if(p.atk>0&&p.atk<3&&p.hit!==tick&&Math.abs(p.x-o.x)<R[p.id][6]+12&&Math.abs(p.y-o.y)<22&&!(o.guard&&o.face===-p.face)){o.hp=Math.max(0,o.hp-R[p.id][5]*(p.kind==='special'?2:p.kind==='heavy'?1.5:1));o.stun=p.kind==='heavy'?13:8;o.v=p.face*2.8;p.meter=Math.min(100,p.meter+12);p.hit=tick;shake=p.kind==='special'?6:3}}
function select(){stage();txt('SELECT YOUR FIGHTER',192,35,14,'#fff','center');txt(turn?'PLAYER 2 — CHOOSE':'PLAYER 1 — CHOOSE',192,50,7,'#f18aa1','center');R.forEach((r,i)=>{let xx=67+i*125;box(xx-38,76,76,86,chosen[turn]===i?'#553044':'#211c2a');box(xx-38,76,76,2,r[3]);draw({...make(i,0),x:xx,y:153,face:1});txt(r[0],xx,174,8,'#fff','center');txt(r[1],xx,184,5,'#c8b7c4','center')});txt('A / D OR ARROWS TO SELECT · ENTER TO CONFIRM',192,208,6,'#d5c1ce','center')}
function loop(){tick++;g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.7}if(mode==='title'){stage();txt('HELLBOUND',192,75,27,'#f6e8ed','center');txt('THE UNDERWORLD HAS A NEW CHAMPION',192,96,7,'#e36a83','center');txt('PRESS ENTER',192,143,12,'#fff','center');txt('ARCADE COMBAT · LOCAL VERSUS',192,164,7,'#b8a8b6','center')}else if(mode==='select')select();else{stage();if(mode==='fight'){update(a,b);update(b,a);hit(a,b);hit(b,a);if(tick%60===0)time=Math.max(0,time-1);if(a.hp<=0||b.hp<=0||time===0){winner=a.hp===b.hp?0:a.hp>b.hp?1:2;mode='over';status.textContent='ROUND OVER'}}draw(a);draw(b);hud();if(mode==='over'){box(55,72,274,70,'#100e18');box(55,72,274,2,'#d34a6b');txt(winner===0?'DRAW':R[winner===1?a.id:b.id][0]+' WINS',192,104,17,'#fff','center');txt('ENTER: REMATCH · ESC: SELECT',192,124,7,'#e8b9c8','center')}}g.restore();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{K[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='Enter'){if(mode==='title'){mode='select';status.textContent='SELECT FIGHTERS'}else if(mode==='select'){if(!turn)turn=1;else{turn=0;start()}}else if(mode==='over')start()}if(e.key==='Escape'&&(mode==='fight'||mode==='over')){mode='select';turn=0;status.textContent='SELECT FIGHTERS'}if(mode==='select'&&['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){chosen[turn]=(chosen[turn]+(['ArrowLeft','a','A'].includes(e.key)?2:1))%3}});document.addEventListener('keyup',e=>K[e.key]=false);document.querySelector('#reset').onclick=()=>{mode='select';turn=0;status.textContent='SELECT FIGHTERS'};requestAnimationFrame(loop)})();
</script></body></html>
