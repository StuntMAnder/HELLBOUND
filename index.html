<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLBOUND</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% -20%,#54213b,#1a1421 48%,#08090f);color:#f7edf2;font:14px system-ui}main{width:min(100%,1100px)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.logo{font-size:clamp(30px,5vw,48px);font-weight:950;letter-spacing:.2em;text-shadow:0 0 26px #e52e5c}.sub,.build{font:10px monospace;letter-spacing:.25em;color:#c18fa4}.frame{border:1px solid #a34c68;box-shadow:0 0 0 5px #211521,0 24px 70px #000b;background:#080910}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#1c1521;border-top:1px solid #67364b;color:#c8b4c1;font:10px monospace;letter-spacing:.12em}button{background:#401e31;border:1px solid #ad4a69;color:white;padding:8px 13px;font-weight:800;letter-spacing:.1em;cursor:pointer}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#a99bab;font:10px monospace;margin-top:13px}.controls b{color:#f2dce5}.foot{font:10px monospace;color:#776b7b;margin-top:12px}</style></head><body><main><header><div><div class="logo">HELLBOUND</div><div class="sub">THE PIT HAS NO EXIT</div></div><div class="build">ARCADE SYSTEM // BUILD 0.2</div></header><div class="frame"><canvas id="game" width="384" height="224"></canvas><div class="status"><span>MODE: ARCADE / LOCAL VERSUS</span><span id="status">PRESS ENTER</span><button id="reset">RETURN TO MENU</button></div></div><div class="controls"><span><b>P1</b> A/D MOVE · W JUMP · F LIGHT · G HEAVY · H SPECIAL · T GUARD</span><span><b>P2</b> ←/→ MOVE · ↑ JUMP · J LIGHT · K HEAVY · L SPECIAL · I GUARD</span></div><div class="foot">384 × 224 PIXEL PLAYFIELD · HELLBOUND ORIGINAL CHARACTER STUDIES</div></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),status=document.querySelector('#status'),K={};const F=184,R=[{name:'HANK',title:'THE REDLINE',role:'RUSHDOWN / TONFA SPECIALIST',glow:'#ff4668',speed:2.05,power:7,reach:32,hp:100},{name:'REAPER',title:'THE LAST SHADOW',role:'RANGE / PUNISHMENT',glow:'#e8e2ed',speed:1.5,power:12,reach:43,hp:112},{name:'PHANTOM',title:'THE PHASE GHOST',role:'MOBILITY / MIX-UP',glow:'#c5a2ff',speed:2.35,power:8,reach:34,hp:94}];let state='title',tick=0,time=99,chosen=[0,1],turn=0,shake=0,winner=-1,round=1,parts=[],a,b;
function make(id,s){return{id,side:s,x:s?278:106,y:F,v:0,vy:0,hp:R[id].hp,max:R[id].hp,face:s?-1:1,stun:0,attack:null,cool:0,guard:false,air:false,meter:0};}function start(){a=make(chosen[0],0);b=make(chosen[1],1);time=99;state='fight';status.textContent='ROUND '+round+' — FIGHT!';}
function B(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}function T(s,x,y,n=8,col='#fff',al='left'){g.fillStyle=col;g.font='bold '+n+'px monospace';g.textAlign=al;g.fillText(s,x,y);}function P(p,col,stroke){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath();g.fillStyle=col;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}}function G(x,y,r,col,alpha=.2){g.save();g.globalAlpha=alpha;g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();}
function stage(){let z=g.createLinearGradient(0,0,0,224);z.addColorStop(0,'#111322');z.addColorStop(.55,'#302035');z.addColorStop(1,'#0b0b13');g.fillStyle=z;g.fillRect(0,0,384,224);for(let i=0;i<11;i++){let x=i*39-8,h=48+i*17%39;B(x,166-h,27,h,'#171725');B(x+3,169-h,2,h-8,'#382338');for(let j=0;j<3;j++)if((i+j)%2===0)B(x+7+j*6,130-h/3,2,3,'#77344d');}G(192,78,42,'#b62c52',.1);g.fillStyle='#47263c';g.beginPath();g.arc(192,78,27,0,7);g.fill();g.fillStyle='#6e3048';g.beginPath();g.arc(192,78,22,0,7);g.fill();for(let i=0;i<7;i++){g.strokeStyle='#4a3448';g.beginPath();g.moveTo(18+i*59,0);g.lineTo(18+i*59,40+i*13%30);g.stroke();}B(0,176,384,48,'#12111a');B(0,176,384,2,'#a84966');for(let i=0;i<12;i++){g.strokeStyle='#261d2a';g.beginPath();g.moveTo(i*34,183);g.lineTo(i*34+17,223);g.stroke();}}
function hank(){P([[-7,-43],[-17,-39],[-28,-31],[-25,-8],[-17,-15],[-7,-18]],'#71152f','#b62a49');g.strokeStyle='#d23a57';g.beginPath();g.moveTo(-13,-35);g.lineTo(-22,-14);g.stroke();P([[-8,-15],[-1,-14],[-3,-2],[-11,0],[-13,-3]],'#282833','#62606c');P([[1,-14],[9,-15],[13,-3],[7,0],[2,-4]],'#33313c','#6b6570');B(-14,-3,12,4,'#15151e');B(4,-3,12,4,'#15151e');P([[-10,-43],[8,-43],[12,-25],[7,-16],[-8,-16],[-13,-26]],'#282832','#77717b');P([[-8,-40],[0,-38],[-3,-23],[-9,-25]],'#48434f');P([[2,-39],[8,-40],[9,-25],[2,-23]],'#171821');B(-3,-35,7,3,'#c52c4c');P([[-10,-40],[-16,-37],[-18,-25],[-12,-22],[-7,-31]],'#383540','#79717a');P([[8,-40],[15,-37],[18,-25],[12,-22],[7,-31]],'#302e39','#79717a');P([[-10,-55],[-7,-62],[6,-62],[11,-55],[8,-45],[-8,-45]],'#34323d','#918591');P([[-8,-57],[-5,-60],[7,-59],[9,-54],[5,-49],[-7,-50]],'#090b13','#6c5c68');B(-7,-56,6,3,'#fa3156');B(2,-56,6,3,'#fa3156');G(2,-55,8,'#e62b55',.13);for(let x of [-18,18]){g.save();g.translate(x,-25);g.rotate(x<0?-.2:.25);B(-2,-13,4,17,'#d7c7b7');B(-6,-6,12,3,'#b92b49');g.restore();}}
function reaper(){P([[-11,-48],[-17,-37],[-15,-22],[-19,-5],[-10,-10],[-4,-3],[2,-11],[9,-4],[14,-24],[14,-39],[8,-51]],'#090a10','#34303d');P([[-10,-44],[0,-49],[10,-43],[8,-26],[0,-19],[-9,-26]],'#171620','#4a4350');P([[-13,-53],[-9,-62],[0,-66],[10,-61],[14,-51],[9,-43],[-9,-43]],'#08090f','#4b4552');P([[-8,-53],[0,-57],[8,-53],[6,-47],[-7,-47]],'#030409');g.strokeStyle='#e9e4ed';g.lineWidth=2;g.beginPath();g.moveTo(-5,-48);g.lineTo(5,-48);g.stroke();g.strokeStyle='#d7d1df';g.beginPath();g.moveTo(10,-34);g.lineTo(17,-25);g.lineTo(21,-18);g.quadraticCurveTo(31,-14,31,-26);g.quadraticCurveTo(30,-33,25,-30);g.stroke();}
function phantom(){P([[-6,-56],[-18,-57],[-27,-46],[-25,-31],[-20,-16],[-16,-34],[-11,-43]],'#e6e0ec','#aaa2b8');P([[-12,-49],[-22,-43],[-21,-24],[-16,-15],[-14,-36]],'#c7c0d2');P([[-9,-16],[-1,-15],[-3,-3],[-12,0],[-14,-3]],'#56536c','#a79bb9');P([[1,-15],[9,-16],[13,-3],[6,0],[2,-4]],'#49465f','#a79bb9');P([[-10,-43],[9,-43],[13,-24],[7,-15],[-8,-15],[-13,-25]],'#656078','#b2a7c0');P([[-7,-40],[0,-36],[7,-40],[8,-25],[0,-21],[-8,-25]],'#343044','#9e8bbd');g.strokeStyle='#d5a8ff';g.lineWidth=2;g.beginPath();g.moveTo(0,-37);g.lineTo(0,-24);g.stroke();G(0,-30,8,'#a56bff',.18);P([[-10,-57],[-7,-63],[6,-63],[11,-57],[8,-46],[-8,-46]],'#b6b2c4','#e4ddeb');P([[-7,-56],[-5,-59],[5,-59],[8,-55],[5,-51],[-6,-51]],'#292638','#877a9d');B(-5,-56,10,2,'#c39aff');}
function draw(p){g.save();g.translate(Math.round(p.x),Math.round(p.y)+Math.sin(tick*.09+p.side)*.7);g.scale(p.face,1);if(p.id===0)hank();else if(p.id===1)reaper();else phantom();if(p.guard){g.globalAlpha=.35;g.strokeStyle=R[p.id].glow;g.lineWidth=2;g.beginPath();g.arc(0,-29,27,-1.2,1.2);g.stroke();}if(p.attack&&p.attack.phase==='active'){g.globalAlpha=.8;g.strokeStyle=R[p.id].glow;g.lineWidth=3;g.beginPath();g.arc(12,-28,24,-.9,.8);g.stroke();}g.restore();}
function spark(x,y,col){for(let i=0;i<10;i++){let z=i*Math.PI/5;parts.push({x,y,vx:Math.cos(z)*(1+Math.random()*2),vy:Math.sin(z)*2-1,life:12,col});}}function effects(){for(let p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;g.globalAlpha=p.life/12;B(p.x,p.y,2,2,p.col);}g.globalAlpha=1;parts=parts.filter(p=>p.life>0);}
function meter(x,y,w,v,col,rev=false){B(x,y,w,7,'#302333');let n=w*Math.max(0,v)/100;B(rev?x+w-n:x,y,n,7,col);B(x,y,w,1,'#c9a0b1');}function hud(){T('1P  '+R[a.id].name,8,11);T(R[b.id].name+'  2P',376,11,8,'#fff','right');meter(8,16,154,a.hp/a.max*100,'#e83a61');meter(222,16,154,b.hp/b.max*100,'#a78ce8',true);T('ROUND '+round,192,11,6,'#e6c8d5','center');T(String(Math.ceil(time)).padStart(2,'0'),192,36,14);T('SUPER',8,35,5,'#cba8b8');T('SUPER',376,35,5,'#cba8b8','right');meter(8,40,54,a.meter,'#e94c75');meter(322,40,54,b.meter,'#b899f1',true);}
function attack(p,type){if(p.cool||p.attack||p.stun)return;let v=type==='light'?[5,4,10,R[p.id].power]:type==='heavy'?[9,5,15,R[p.id].power*1.55]:[13,7,20,R[p.id].power*2.1];p.attack={frame:0,start:v[0],active:v[1],end:v[2],damage:v[3],phase:'startup',landed:false};p.cool=v[0]+v[1]+v[2]+7;p.v=0;}
function update(p,o){p.face=o.x>=p.x?1:-1;if(p.stun>0){p.stun--;p.v*=.84;p.attack=null;}else{let L=p.side?K.ArrowLeft:K.a,D=p.side?K.ArrowRight:K.d,J=p.side?K.ArrowUp:K.w,G=p.side?K.i:K.t,F1=p.side?K.j:K.f,F2=p.side?K.k:K.g,F3=p.side?K.l:K.h;p.guard=!!G&&!p.attack;if(p.cool>0)p.cool--;if(p.attack){let q=p.attack;q.frame++;q.phase=q.frame<=q.start?'startup':q.frame<=q.start+q.active?'active':'recovery';if(q.frame>q.start+q.active+q.end)p.attack=null;}else if(!p.guard){p.v=((D?1:0)-(L?1:0))*R[p.id].speed;if(J&&!p.air){p.vy=-5.2;p.air=true;}if(F1)attack(p,'light');else if(F2)attack(p,'heavy');else if(F3&&p.meter>=50){p.meter-=50;attack(p,'special');}}else p.v*=.65;}p.x=Math.max(24,Math.min(360,p.x+p.v));p.y+=p.vy;p.vy+=.27;if(p.y>=F){p.y=F;p.vy=0;p.air=false;}}
function hit(p,o){let q=p.attack;if(!q||q.phase!=='active'||q.landed||Math.abs(p.x-o.x)>=R[p.id].reach+(q.damage>R[p.id].power*2?12:0)||Math.abs(p.y-o.y)>25)return;let block=o.guard&&o.face===-p.face;o.hp=Math.max(0,o.hp-(block?Math.max(1,q.damage*.18):q.damage));q.landed=true;p.meter=Math.min(100,p.meter+(block?5:14));o.stun=block?3:q.damage>R[p.id].power*1.4?15:9;o.v=block?p.face*.7:p.face*(q.damage>R[p.id].power*2?4:2.6);spark((p.x+o.x)/2,o.y-30,block?'#e6d5ee':R[p.id].glow);shake=block?1:q.damage>R[p.id].power*2?6:3;}
function title(){stage();G(192,94,65,'#df2858',.18);T('HELLBOUND',192,73,29,'#fff','center');T('THE PIT HAS NO EXIT',192,89,7,'#e95b7a','center');g.strokeStyle='#8e3b58';g.beginPath();g.moveTo(87,102);g.lineTo(297,102);g.stroke();T('CHOOSE YOUR FATE',192,128,8,'#e8d5df','center');T('PRESS ENTER TO BEGIN',192,158,9);T('ARCADE COMBAT / LOCAL VERSUS',192,190,6,'#a98e9f','center');}
function select(){stage();T('SELECT YOUR FIGHTER',192,24,12,'#fff','center');T(turn?'PLAYER 2 — SELECT':'PLAYER 1 — SELECT',192,36,6,'#ef8aa5','center');R.forEach((r,i)=>{let x=66+i*126,s=chosen[turn]===i;B(x-48,51,96,126,s?'#382032':'#171520');B(x-48,51,96,2,s?r.glow:'#493246');g.save();g.translate(x,146);g.scale(.92,.92);if(i===0)hank();else if(i===1)reaper();else phantom();g.restore();T(r.name,x,158,8,s?'#fff':'#c1b2c1','center');T(r.title,x,168,5,r.glow,'center');});T(R[chosen[turn]].role,192,193,6,'#e6cbd8','center');T('A / D OR ARROWS TO MOVE · ENTER TO CONFIRM',192,216,5,'#a98d9f','center');}
function match(){stage();if(state==='fight'){update(a,b);update(b,a);hit(a,b);hit(b,a);if(tick%60===0)time=Math.max(0,time-1);if(a.hp<=0||b.hp<=0||time===0){winner=a.hp===b.hp?-1:a.hp>b.hp?0:1;state='over';status.textContent='MATCH COMPLETE';}}draw(a);draw(b);effects();hud();if(state==='over'){B(55,75,274,70,'#0b0a12');B(55,75,274,2,'#e43c64');T(winner<0?'DRAW':R[winner===0?a.id:b.id].name+' WINS',192,105,17,'#fff','center');T('ENTER REMATCH · ESC FIGHTER SELECT',192,126,6,'#e8c3d2','center');}}
function loop(){tick++;g.save();if(shake>.1){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.72;}if(state==='title')title();else if(state==='select')select();else match();g.restore();requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{K[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.repeat&&['Enter','Escape'].includes(e.key))return;if(e.key==='Enter'){if(state==='title'){state='select';status.textContent='FIGHTER SELECT';}else if(state==='select'){if(turn===0)turn=1;else{turn=0;round=1;start();}}else if(state==='over'){round++;start();}}if(e.key==='Escape'&&(state==='fight'||state==='over')){state='select';turn=0;status.textContent='FIGHTER SELECT';}if(state==='select'&&['a','A','d','D','ArrowLeft','ArrowRight'].includes(e.key))chosen[turn]=(chosen[turn]+(['a','A','ArrowLeft'].includes(e.key)?2:1))%3;});document.addEventListener('keyup',e=>K[e.key]=false);document.querySelector('#reset').onclick=()=>{state='title';turn=0;status.textContent='PRESS ENTER';};requestAnimationFrame(loop);
})();</script></body></html>
